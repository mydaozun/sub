proxy-groups:
  - name: 🚀 国外流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 🚀 手动选择1
      - 🚀 手动选择2
      - 🇸🇬 新加坡节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🇮🇳 印度节点
      - 🇬🇧 英国节点
      - 🇫🇷 法国节点
      - 🇷🇺 俄罗斯节点
      - 🇩🇪 德国节点
  - name: 🚀 手动选择1
    include-all: true
    type: select
  - name: 🚀 手动选择2
    include-all: true
    type: select
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - ♻️ 自动选择
      - 🚀 国外流量
      - 🎯 国内流量
      - 🚀 手动选择1
      - 🚀 手动选择2
      - 🔯 故障转移
      - 🔮 负载均衡
  - name: 🚀 免流
    include-all: true
    filter: (80|443|TCP|浙停|广停|绿通)
    type: select
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: (^(?!.*(剩余流量|到期时间|过期时间|官网地址|产品名称|先购买套餐|流量消耗|唯一官网|更新订阅)).*)
    interval: 180
    tolerance: 50
    url: https://i.ytimg.com/generate_204
  - name: 🔯 故障转移
    type: fallback
    include-all: true
    filter: (^(?!.*(剩余流量|到期时间|过期时间|官网地址|产品名称|先购买套餐|流量消耗|唯一官网|更新订阅)).*)
    interval: 300
    tolerance: 50
    url: https://i.ytimg.com/generate_204
  - name: 🔮 负载均衡
    type: load-balance
    include-all: true
    filter: (^(?!.*(剩余流量|到期时间|过期时间|官网地址|产品名称|先购买套餐|流量消耗|唯一官网|更新订阅)).*)
