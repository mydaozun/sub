proxy-groups:
  - name: 🚀 国外流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - ✈️ 手动选择
      - 🛩️ 手动选择备用
      - 🚁 自建节点
  - name: ✈️ 手动选择
    include-all: true
    type: select
  - name: 🛩️ 手动选择备用
    include-all: true
    type: select
  - name: 🚁 自建节点
    include-all: true
    filter: (自建|Craig|hk-vmess|HY|海晏河清|backup|_)
    type: select
  - name: 🎯 国内流量
    type: select
    proxies:
      - DIRECT
      - "(电信|联通|移动)"
      - 🚀 国外流量
      - ✈️ 手动选择
      - 🛩️ 手动选择备用
      - 🚁 自建节点
  - name: 🛸 IP归属地伪装
    type: select
    proxies:
      - 🎯 国内流量
      - "(CN|电信|联通|移动)"
      - ✈️ 手动选择
      - 🛩️ 手动选择备用
      - 🚁 自建节点
  - name: 🐟 漏网之鱼
