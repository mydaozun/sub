;设置分组标志位
custom_proxy_group=PROXY`select`[]AUTO`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO`.*`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,,50`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=AIGC`select`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Telegram`select`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=Google`select`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO
custom_proxy_group=HK AUTO`url-test`(香港|Hong Kong|HK|🇭🇰)`http://www.gstatic.com/generate_204`300,,50`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=SG AUTO`url-test`(新加坡|Singapore|🇸🇬)`http://www.gstatic.com/generate_204`300,,50`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=JP AUTO`url-test`(日本|Japan|🇯🇵)`http://www.gstatic.com/generate_204`300,,50`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=US AUTO`url-test`(美国|USA|🇺🇸)`http://www.gstatic.com/generate_204`300,,50`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
custom_proxy_group=GLOBAL`select`[]PROXY`[]AUTO`[]AIGC`[]Telegram`[]Google`[]HK AUTO`[]SG AUTO`[]JP AUTO`[]US AUTO`.*`(?i)GB|Traffic|Expire|Premium|频道|订阅|ISP|流量|到期|重置
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true